<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MegaMart - Landing Page</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>
    <div class="top-utility-bar">
        <div>Welcome to worldwide Megamart!</div>
        <div class="right-options">
            <a href="#"><i class="fa-solid fa-location-dot"></i> Deliver to <span class="zip-code">423651</span></a>
            <div> | </div>
            <a href="#"><i class="fa-solid fa-truck"></i> Track your order</a>
            <div> | </div>
            <a href="#"><i class="fa-solid fa-tag"></i> All Offers</a>
        </div>
    </div>
    <header class="main-header">
        <div class="brand-area">
            <i class="fa-solid fa-bars menu-toggle"></i>
            <div class="logo">MegaMart</div>
        </div>
        
        <div class="search-bar-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search essentials, groceries and more...">
        </div>

        <div class="user-actions">
            <a href="#"><i class="fa-regular fa-user"></i> Sign Up/Sign In</a>
            <a href="#"><i class="fa-solid fa-cart-shopping"></i> Cart</a>
        </div>
    </header>
    <nav class="categories-nav">
        <a href="#" class="cat-btn active">Groceries <i class="fa-solid fa-chevron-down"></i></a>
        <a href="#" class="cat-btn">Premium Fruits <i class="fa-solid fa-chevron-down"></i></a>
        <a href="#" class="cat-btn">Home & Kitchen <i class="fa-solid fa-chevron-down"></i></a>
        <a href="#" class="cat-btn">Fashion <i class="fa-solid fa-chevron-down"></i></a>
        <a href="#" class="cat-btn">Electronics <i class="fa-solid fa-chevron-down"></i></a>
        <a href="#" class="cat-btn">Beauty <i class="fa-solid fa-chevron-down"></i></a>
        <a href="#" class="cat-btn">Home Improvement <i class="fa-solid fa-chevron-down"></i></a>
        <a href="#" class="cat-btn">Sports, Toys & Luggage <i class="fa-solid fa-chevron-down"></i></a>
    </nav>
    <div class="banner-container">
        <a href="#" class="carousel-arrow left"><i class="fa-solid fa-chevron-left"></i></a>
        
        <div class="main-banner">
            <div class="banner-text">
                <h3>Best Deal Online on smart watches</h3>
                <h1>SMART WEARABLE.</h1>
                <p>UP TO 80% OFF</p>
                <div class="carousel-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>
            <div class="banner-image">
                <img src="assets/relogio.jpg.png" alt="relogio">
            </div>
        </div>

        <a href="#" class="carousel-arrow right"><i class="fa-solid fa-chevron-right"></i></a>
    </div>

</body>
</html>
